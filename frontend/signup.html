<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cholemetric - Sign Up</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #EEEEEE;
            background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Inter', sans-serif;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        /* Back Button */
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #111;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
            align-self: flex-start;
        }
        
        .back-btn svg {
            width: 22px;
            height: 22px;
            fill: #111;
        }

        /* Header Area */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .header-icon {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            border-radius: 50%;
            overflow: hidden;
        }

        .header-icon svg {
            width: 76px;
            height: 76px;
            fill: #2CC295;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .header .subtitle-1 {
            color: #111;
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .header .subtitle-2 {
            color: #111;
            font-size: 0.95rem;
        }

        /* Form Card */
        .form-card {
            padding: 10px 0;
            margin-bottom: 16px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-group label {
            display: block;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg.left-icon {
            position: absolute;
            left: 14px;
            width: 20px;
            height: 20px;
            fill: #2CC295;
        }

        .input-wrapper svg.right-icon {
            position: absolute;
            right: 14px;
            width: 20px;
            height: 20px;
            fill: #555;
            cursor: pointer;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 42px;
            border: 1px solid #CCC;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input::placeholder {
            color: #999;
            font-weight: 500;
        }

        .input-wrapper input:focus {
            border-color: #2CC295;
        }

        /* Password Strength Indicator */
        .password-strength {
            margin-top: 8px;
        }

        .strength-bars {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
        }

        .strength-bar {
            height: 2px;
            flex: 1;
            background-color: #DDDDDD;
        }

        .strength-bar.active {
            background-color: #FF3B30; /* Red for weak */
        }

        .strength-text {
            color: #FF3B30;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .password-rules {
            list-style: none;
            padding-left: 8px;
            margin-bottom: 12px;
        }

        .password-rules li {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #999;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .password-rules li::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #999;
            border-radius: 50%;
        }

        /* Actions */
        .btn-signup {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background-color: #999999; /* Disabled state */
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 24px;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn-signup svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .already-account {
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        .already-account a {
            color: #2CC295;
            text-decoration: none;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: auto;
        }

        .footer-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .footer-title span.lock {
            font-size: 1rem;
        }

        .footer-subtitle {
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="login_form.html" class="back-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Back
        </a>

        <div class="header">
            <div class="header-icon">
                <img src="logo.png" alt="Cholemetric Logo" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <h1>Create Account</h1>
            <div class="subtitle-1">Join Cholemetric platform</div>
            <div class="subtitle-2">For Medical Professionals</div>
        </div>

        <div class="form-card">
            <div class="input-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <svg class="left-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <input type="text" id="signup_name" placeholder="Enter full name">
                </div>
            </div>

            <div class="input-group">
                <label>Hospital/Clinic(Optional)</label>
                <div class="input-wrapper">
                    <svg class="left-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM10 4h4v2h-4V4zM20 19H4V8h16v11z"/><path d="M13 10h-2v3H8v2h3v3h2v-3h3v-2h-3z"/></svg>
                    <input type="text" id="signup_hospital" placeholder="Enter hospital name">
                </div>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <svg class="left-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <input type="email" id="signup_email" placeholder="Enter your email">
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <svg class="left-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="signup_password" placeholder="Create a Password">
                    <svg class="right-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </div>
                
                <div class="password-strength">
                    <div class="strength-bars">
                        <div class="strength-bar active"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                    </div>
                    <div class="strength-text">weak password</div>
                    <ul class="password-rules">
                        <li>At least 8 characters</li>
                        <li>One uppercase letter</li>
                        <li>One number</li>
                        <li>One special character</li>
                    </ul>
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <svg class="left-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="signup_confirm_password" placeholder="Re-enter Password">
                    <svg class="right-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </div>
            </div>
        </div>

        <a href="#" id="btn_signup" class="btn-signup" style="display: flex; align-items: center; justify-content: center; text-decoration: none; background-color: #2CC295;">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 14c-2.67 0-8 1.34-8 4v2h11v-2c0-1.02.35-2.32 1.15-3.39-.92-.41-2.33-.61-4.15-.61z" />
                <path d="M11 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z" />
                <path d="M20 15v-3h-2v3h-3v2h3v3h2v-3h3v-2z" />
            </svg>
            Create Account
        </a>

        <div class="already-account">
            Already have an account? <a href="login_form.html">Sign in</a>
        </div>

        <div class="footer">
            <div class="footer-title">
                <span class="lock">🔒</span> Secure Medical Platform
            </div>
            <div class="footer-subtitle">
                For Licensed Medical Professionals Only
            </div>
        </div>
    </div>

    <script>
        document.getElementById('btn_signup').addEventListener('click', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('signup_name').value.trim();
            const hospital = document.getElementById('signup_hospital').value.trim();
            const email = document.getElementById('signup_email').value.trim();
            const password = document.getElementById('signup_password').value;
            const confirmPassword = document.getElementById('signup_confirm_password').value;

            if (!full_name || !email || !password) {
                alert('Please fill all required fields.');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            const btn = document.getElementById('btn_signup');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Creating...';
            btn.style.pointerEvents = 'none';

            try {
                const response = await fetch('http://localhost/cholemetric_backend/gb_stone_api/register.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, hospital, email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = 'login_form.html';
                } else {
                    alert(data.error || 'Registration failed.');
                    btn.innerHTML = originalText;
                    btn.style.pointerEvents = 'auto';
                }
            } catch (err) {
                alert('Network error. Please try again later.');
                btn.innerHTML = originalText;
                btn.style.pointerEvents = 'auto';
            }
        });
    </script>
</body>
</html>
