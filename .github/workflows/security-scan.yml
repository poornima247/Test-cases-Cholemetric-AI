name: MobSF Security Scan

on:
  push:
    branches: [ "android-frontend", "main" ]
  pull_request:
    branches: [ "android-frontend", "main" ]

jobs:
  mobsf_scan:
    runs-on: ubuntu-latest
    name: Scan Android APK
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Build APK (Mock)
        run: |
          # Normally we would run ./gradlew assembleDebug here
          # For this boilerplate, we'll assume an APK is built
          echo "Building APK..."
          mkdir -p app/build/outputs/apk/debug
          touch app/build/outputs/apk/debug/app-debug.apk

      - name: MobSF Scan
        uses: fundacion-sadosky/mobsf-action@v1.0.3
        continue-on-error: true
        env:
          INPUT_FILE_NAME: app/build/outputs/apk/debug/app-debug.apk
          SCAN_TYPE: apk

      - name: Upload MobSF Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: MobSF-Security-Report
          path: mobsf-report.pdf
