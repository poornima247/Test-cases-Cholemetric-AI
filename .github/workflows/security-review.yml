name: Static Security Review and Hardening Checks
on:
  push:
    branches: [ "main", "master", "develop", "backend" ]
  pull_request:
    branches: [ "main", "master", "develop", "backend" ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl semgrep
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Semgrep SAST
        run: |
          semgrep --config=auto --json > semgrep-results.json || true
        continue-on-error: true

      - name: Run Gitleaks (Detect Secrets)
        run: |
          gitleaks detect -v --report-format json --report-path gitleaks-report.json || true
        continue-on-error: true

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Run Functional API Security Tests
        env:
          BASE_URL: http://localhost/gb_stone_api
        run: |
          # In a real environment, we would start a mock server or point to a staging environment
          # Using dry-run here since we don't have the API running in the GH Actions runner
          python security-testing/run_security_tests.py --dry-run

      - name: Generate Excel Reports
        run: |
          python security-testing/generate_reports.py
        
      - name: Upload Security Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            security-testing/reports/
            semgrep-results.json
            gitleaks-report.json
            trivy-results.json
            security-testing/results.json
          retention-days: 30

      - name: Publish GitHub Actions Step Summary
        run: |
          echo "# Security Testing Summary :shield:" >> $GITHUB_STEP_SUMMARY
          echo "## SAST & Secret Scanning completed." >> $GITHUB_STEP_SUMMARY
          echo "- **Semgrep**: Finished." >> $GITHUB_STEP_SUMMARY
          echo "- **Gitleaks**: Finished." >> $GITHUB_STEP_SUMMARY
          echo "- **Trivy**: Finished." >> $GITHUB_STEP_SUMMARY
          echo "## Dynamic Tests" >> $GITHUB_STEP_SUMMARY
          echo "- **API Security Tests**: Over 400 tests executed (dry-run)." >> $GITHUB_STEP_SUMMARY
          echo "### Reports" >> $GITHUB_STEP_SUMMARY
          echo "Download the generated Excel reports from the artifacts section to see full details." >> $GITHUB_STEP_SUMMARY

      - name: Fail on Critical Vulnerabilities
        run: |
          # Parse results and fail if critical findings exist.
          # Here we use a simple grep on the generated reports.
          if grep -qi '"severity": "CRITICAL"' security-testing/results.json; then
            echo "Critical vulnerabilities found in security tests. Failing build."
            exit 1
          fi
          if grep -q '"severity": "CRITICAL"' semgrep-results.json 2>/dev/null; then
            echo "Critical vulnerabilities found by Semgrep. Failing build."
            exit 1
          fi
