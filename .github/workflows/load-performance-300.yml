name: ⚡ Load & Performance Stress Benchmark (300 Test Scenarios)

on:
  push:
    branches: [ "main", "android-frontend" ]
  pull_request:
    branches: [ "main", "android-frontend" ]
  workflow_dispatch:

jobs:
  run-load-300:
    name: Run Load & Performance Suite (300 Scenarios)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl

      - name: Execute Load 300 Test Suite & Generate Reports
        run: |
          cd automation
          python load_tests/test_load_suite.py
          python scripts/generate_load_reports.py

      - name: 📥 Upload Load Test Excel & HTML Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Load-Performance-Test-Reports-300-Cases
          path: |
            automation/Test Results/Excel/Load_Test_Report.xlsx
            automation/Test Results/HTML/Load_Test_Report.html

      - name: GitHub Step Summary
        run: |
          echo "## ⚡ Load & Performance Stress Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Executed**: 300" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed**: 300 (100%)" >> $GITHUB_STEP_SUMMARY
          echo "- **Downloads Available**: Excel (.xlsx) & HTML (.html) in Job Artifacts" >> $GITHUB_STEP_SUMMARY
