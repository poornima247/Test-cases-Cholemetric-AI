name: Android Appium E2E Automation

on:
  push:
    branches: [ "main", "android-frontend" ]
  pull_request:
    branches: [ "main", "android-frontend" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          appium &
          sleep 10
          curl http://localhost:4723/status || exit 1

      - name: Run Appium Tests with Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            cd automation
            mvn clean test

      - name: Generate Markdown Summary
        if: always()
        run: |
          echo "# Android Appium E2E Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Build Number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "Execution Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "Git Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for full HTML and Excel reports." >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: Automation-Reports
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
            automation/*.csv
          retention-days: 30

  deploy-reports:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          name: Automation-Reports
          path: public/reports/latest
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
