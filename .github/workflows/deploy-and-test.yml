name: 🚀 Deploy, Test & Publish — Cholemetric Web CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write        # needed to push history to gh-pages
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Build & Deploy to GitHub Pages
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: "📦 Build & Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: "📥 Stage 1 — Checkout repository"
        uses: actions/checkout@v4

      - name: "☕ Stage 2 — Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: "📦 Stage 3 — Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "✅ Stage 4 — Verify frontend directory exists"
        run: |
          echo "Checking frontend directory..."
          if [ ! -d "frontend" ]; then
            echo "❌ Frontend directory not found!"
            ls -la
            exit 1
          fi
          echo "✅ Frontend directory found:"
          find frontend -name "*.html" | head -20

      - name: "🔍 Stage 5 — HTML Validation"
        run: |
          npm install -g html-validate@latest
          echo '{
            "extends": ["html-validate:recommended"],
            "rules": {
              "no-inline-style": "off",
              "require-sri": "off",
              "long-title": "off"
            }
          }' > .htmlvalidate.json
          echo "Running HTML validation..."
          html-validate "frontend/**/*.html" 2>&1 || echo "⚠️ HTML validation warnings (non-blocking)"

      - name: "⚙️ Stage 6 — Configure GitHub Pages"
        uses: actions/configure-pages@v5

      - name: "📤 Stage 7 — Upload frontend to Pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'

      - name: "🚀 Stage 8 — Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4

      - name: "📋 Stage 9 — Print deployed URL"
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Live URL: ${{ steps.deployment.outputs.page_url }}"
          echo "PAGE_URL=${{ steps.deployment.outputs.page_url }}" >> $GITHUB_ENV

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — Selenium E2E Tests
  # ═══════════════════════════════════════════════════════════════════════════
  selenium-tests:
    name: "🧪 Selenium E2E Tests (400+ Test Cases)"
    runs-on: ubuntu-latest
    needs: deploy
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "☕ Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "📦 Install Python dependencies"
        run: |
          pip install openpyxl jinja2

      - name: "🌐 Install Chrome & ChromeDriver"
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: "⏳ Stage 10 — Wait for GitHub Pages to propagate"
        run: |
          PAGE_URL="${{ needs.deploy.outputs.page_url }}"
          echo "⏳ Waiting for deployment to propagate at: $PAGE_URL"
          for i in {1..12}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$PAGE_URL" || echo "000")
            echo "Attempt $i — HTTP Status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
              echo "✅ Site is live!"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "❌ Site did not become available after 60 seconds"
              exit 1
            fi
            sleep 5
          done

      - name: "🧪 Stage 11 — Run Selenium E2E Test Suite"
        id: selenium_run
        run: |
          cd web-automation
          echo "🔎 Base URL: ${{ needs.deploy.outputs.page_url }}"
          mvn test \
            -DBASE_URL="${{ needs.deploy.outputs.page_url }}" \
            -DBROWSER=chrome \
            -DHEADLESS=true \
            -Dsurefire.failIfNoSpecifiedTests=false \
            2>&1 | tee ../selenium-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Maven exit code: $EXIT_CODE"
          # Store exit code for later but don't fail immediately
          echo "SELENIUM_EXIT=$EXIT_CODE" >> $GITHUB_ENV
        continue-on-error: true

      - name: "📊 Stage 12 — Generate HTML & Excel Reports"
        if: always()
        run: |
          cd web-automation
          echo "Generating HTML and Excel reports..."
          python scripts/generate_web_reports.py
          echo "✅ Reports generated"

      - name: "📁 Stage 13 — Organize test artifacts"
        if: always()
        run: |
          mkdir -p test-artifacts/surefire-reports
          mkdir -p test-artifacts/reports/HTML
          mkdir -p test-artifacts/reports/Excel
          mkdir -p test-artifacts/reports/JSON
          mkdir -p test-artifacts/screenshots
          mkdir -p test-artifacts/logs

          # Copy surefire XML reports
          if [ -d "web-automation/target/surefire-reports" ]; then
            cp -r web-automation/target/surefire-reports/* test-artifacts/surefire-reports/ 2>/dev/null || true
          fi

          # Copy generated reports
          if [ -d "web-automation/Test Results" ]; then
            cp -r "web-automation/Test Results/"* test-artifacts/reports/ 2>/dev/null || true
          fi

          # Copy screenshots
          if [ -d "web-automation/screenshots" ]; then
            cp -r web-automation/screenshots/* test-artifacts/screenshots/ 2>/dev/null || true
          fi

          # Copy selenium log
          cp selenium-output.log test-artifacts/logs/ 2>/dev/null || true

          echo "📦 Artifact summary:"
          find test-artifacts -type f | head -50

      - name: "📤 Stage 14 — Upload test artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "e2e-test-reports-${{ github.run_number }}"
          path: test-artifacts/
          retention-days: 30

      - name: "📝 Stage 15 — Publish GitHub Step Summary"
        if: always()
        run: |
          SUMMARY_FILE="web-automation/Test Results/Summary/summary.md"
          JSON_FILE="web-automation/Test Results/JSON/execution-results.json"
          
          echo "# 🧪 Cholemetric Web E2E Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }} | **Branch:** \`${{ github.ref_name }}\` | **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** ${{ needs.deploy.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "$JSON_FILE" ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('total',0))")
            PASSED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('passed',0))")
            FAILED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('failed',0))")
            SKIPPED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('skipped',0))")
            if [ "$TOTAL" -gt 0 ]; then
              PASS_RATE=$(python3 -c "print(f'{($PASSED/$TOTAL)*100:.1f}')")
            else
              PASS_RATE="N/A"
            fi
            
            echo "## 📊 Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| Pass Rate | $PASS_RATE% |" >> $GITHUB_STEP_SUMMARY
          else
            if [ -f "$SUMMARY_FILE" ]; then
              cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ No summary file found. Check test artifacts." >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📁 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- HTML Report, Excel Report, Screenshots, and Logs uploaded as: \`e2e-test-reports-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY

      - name: "📜 Stage 16 — Store historical execution record"
        if: always()
        run: |
          # Create a history record in JSON format
          mkdir -p execution-history
          JSON_FILE="web-automation/Test Results/JSON/execution-results.json"
          TOTAL=0; PASSED=0; FAILED=0; SKIPPED=0
          if [ -f "$JSON_FILE" ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('total',0))" 2>/dev/null || echo 0)
            PASSED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('passed',0))" 2>/dev/null || echo 0)
            FAILED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('failed',0))" 2>/dev/null || echo 0)
            SKIPPED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('skipped',0))" 2>/dev/null || echo 0)
          fi
          cat > execution-history/run-${{ github.run_number }}.json << EOF
          {
            "run_number": "${{ github.run_number }}",
            "sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "site_url": "${{ needs.deploy.outputs.page_url }}",
            "total": $TOTAL,
            "passed": $PASSED,
            "failed": $FAILED,
            "skipped": $SKIPPED
          }
          EOF
          echo "📜 History record saved:"
          cat execution-history/run-${{ github.run_number }}.json

      - name: "📤 Upload execution history record"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "execution-history-${{ github.run_number }}"
          path: execution-history/
          retention-days: 90

      - name: "🚦 Stage 17 — Check test pass/fail threshold"
        if: always()
        run: |
          JSON_FILE="web-automation/Test Results/JSON/execution-results.json"
          if [ -f "$JSON_FILE" ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('total',0))" 2>/dev/null || echo 0)
            FAILED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('failed',0))" 2>/dev/null || echo 0)
            echo "Total: $TOTAL, Failed: $FAILED"
            if [ "$TOTAL" -gt 0 ] && [ "$FAILED" -gt 0 ]; then
              FAIL_RATE=$(python3 -c "print(f'{($FAILED/$TOTAL)*100:.1f}')")
              echo "Failure rate: $FAIL_RATE%"
              # Fail the build only if >20% tests fail
              FAIL_CHECK=$(python3 -c "print('FAIL' if $FAILED/$TOTAL > 0.20 else 'OK')")
              if [ "$FAIL_CHECK" = "FAIL" ]; then
                echo "❌ Failure rate $FAIL_RATE% exceeds 20% threshold!"
                exit 1
              else
                echo "✅ Failure rate $FAIL_RATE% is within acceptable threshold (<20%)"
              fi
            fi
          else
            echo "⚠️ No results JSON found — skipping threshold check"
            # Don't fail if tests just couldn't run (deployment issue)
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 — k6 Load / Baseline Testing (100 VUs, 1 minute)
  # ═══════════════════════════════════════════════════════════════════════════
  load-test:
    name: "⚡ k6 Baseline Load Test (100 VUs × 1 min)"
    runs-on: ubuntu-latest
    needs: deploy
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Install k6"
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz -L | tar xvz --strip-components 1
          sudo mv k6 /usr/local/bin/k6
          k6 version

      - name: "⚡ Run k6 Baseline Load Test"
        id: k6_run
        run: |
          PAGE_URL="${{ needs.deploy.outputs.page_url }}"
          mkdir -p k6-results
          
          cat > /tmp/k6-load-test.js << 'EOFK6'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate, Trend, Counter } from 'k6/metrics';

          // Custom metrics
          const errorRate = new Rate('error_rate');
          const pageLoadTime = new Trend('page_load_time_ms');
          const requestCount = new Counter('total_requests');

          export const options = {
            vus: 100,
            duration: '1m',
            thresholds: {
              'http_req_duration': ['p(95)<3000'],  // 95% of requests under 3s
              'http_req_failed': ['rate<0.10'],     // <10% failure rate
              'error_rate': ['rate<0.10'],
            },
          };

          const BASE_URL = __ENV.BASE_URL || 'https://example.github.io/';
          const pages = [
            '',
            'login_form.html',
            'welcome.html',
            'dashboard.html',
            'sign_up.html',
            'faq.html',
            'settings.html',
            'new_analysis.html',
            'patient_history.html',
            'scan_report.html',
          ];

          export default function () {
            const page = pages[Math.floor(Math.random() * pages.length)];
            const url = BASE_URL.endsWith('/') ? BASE_URL + page : BASE_URL + '/' + page;

            const start = Date.now();
            const res = http.get(url, {
              timeout: '10s',
              tags: { page: page || 'index' },
            });
            const duration = Date.now() - start;

            pageLoadTime.add(duration);
            requestCount.add(1);

            const success = check(res, {
              'status is 200': (r) => r.status === 200,
              'response time < 3000ms': (r) => r.timings.duration < 3000,
              'has content': (r) => r.body && r.body.length > 0,
            });

            errorRate.add(!success);
            sleep(0.1);
          }
          EOFK6

          k6 run \
            --env BASE_URL="$PAGE_URL" \
            --out json=k6-results/k6-output.json \
            --summary-export=k6-results/k6-summary.json \
            /tmp/k6-load-test.js \
            2>&1 | tee k6-results/k6-run.log || true

      - name: "📊 Parse k6 Results"
        if: always()
        run: |
          if [ -f "k6-results/k6-summary.json" ]; then
            echo "# ⚡ k6 Load Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python3 << 'PYEOF'
          import json, os

          with open("k6-results/k6-summary.json") as f:
              data = json.load(f)

          metrics = data.get("metrics", {})

          def get_metric(name, stat):
              m = metrics.get(name, {})
              return m.get(stat, m.get("value", "N/A"))

          summary = f"""
          | Metric | Value |
          |--------|-------|
          | 🔢 Total Requests | {get_metric('http_reqs', 'count')} |
          | 📈 Requests/sec | {get_metric('http_reqs', 'rate'):.2f} |
          | ⏱️ Avg Response Time | {get_metric('http_req_duration', 'avg'):.0f}ms |
          | ⚡ Min Response Time | {get_metric('http_req_duration', 'min'):.0f}ms |
          | 🐢 Max Response Time | {get_metric('http_req_duration', 'max'):.0f}ms |
          | 📊 P95 Response Time | {get_metric('http_req_duration', 'p(95)'):.0f}ms |
          | ❌ Failed Requests | {get_metric('http_req_failed', 'rate') * 100:.2f}% |
          | 🌐 Data Received | {get_metric('data_received', 'count') / 1024 / 1024:.2f} MB |
          """
          print(summary)

          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write(summary + "\n")
          PYEOF
          else
            echo "⚠️ k6 summary file not found"
          fi

      - name: "📤 Upload k6 artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "k6-load-test-results-${{ github.run_number }}"
          path: k6-results/
          retention-days: 30
