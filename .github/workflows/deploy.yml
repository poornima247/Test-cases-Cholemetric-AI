name: 🌐 Deploy Cholemetric AI Web Application to GitHub Pages

on:
  push:
    branches: [ "main", "android-frontend" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl

      - name: 🔨 Generate Test Automation Reports & App Bundle
        run: |
          cd automation
          python scripts/generate_reports.py
          python scripts/generate_dashboard.py
          python scripts/generate_summary.py

      - name: 🔨 Run Production Build (npm run build)
        run: |
          npm run build

      - name: 📂 Bundle Application into dist/
        run: |
          mkdir -p dist/reports/latest
          
          # Copy Cholemetric AI Web App frontend HTML & assets
          cp *.html dist/ || true
          cp *.png dist/ || true
          
          # Copy generated test automation reports
          if [ -d "automation/reports/latest" ]; then
            cp -r automation/reports/latest/* dist/reports/latest/ || true
          fi
          if [ -d "reports/latest" ]; then
            cp -r reports/latest/* dist/reports/latest/ || true
          fi

          # Mirror key report files to dist/ for quick direct links
          cp dist/reports/latest/execution-report.html dist/ || true
          cp dist/reports/latest/dashboard.html dist/ || true
          cp dist/reports/latest/Execution_Report.xlsx dist/ || true
          
          # Copy dist contents into public folder for peaceiris action compatibility
          mkdir -p public
          cp -r dist/* public/

      - name: 🚀 Publish to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: 📦 Upload Pages Artifact (Native GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages-native:
    name: 🌐 GitHub Pages Deployment
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages Native Service
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
