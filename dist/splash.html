<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cholemetric Splash Screen</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #5e6cbb; /* Match the purple/blue from the image */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            color: white;
            text-align: center;
        }

        .logo-container {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 8px solid #c4c9e8; /* Light purple/blue border */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .logo-container svg {
            width: 90px;
            height: 90px;
            fill: white;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="logo.png" alt="Cholemetric Logo" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    <h1>Cholemetric</h1>
    <p>AI Calculi Detection System</p>
    <script>
        setTimeout(() => {
            window.location.href = 'welcome.html';
        }, 3000);
    </script>
</body>
</html>
