<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cholemetric - Forgot Password</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #EEEEEE;
            background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Inter', sans-serif;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        /* Header Area */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 40px;
        }

        .header-icon {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .header-icon svg {
            width: 100%;
            height: 100%;
            fill: #4A69BD;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .header .subtitle {
            color: #888888;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            padding: 0 10px;
        }

        /* Form Fields */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #888888;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg.left-icon {
            position: absolute;
            left: 14px;
            width: 22px;
            height: 22px;
            fill: #AAAAAA;
        }

        .input-wrapper svg.right-icon {
            position: absolute;
            right: 14px;
            width: 22px;
            height: 22px;
            fill: #555555;
            cursor: pointer;
            transition: opacity 0.2s, fill 0.2s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 40px 16px 44px;
            border: 1px solid #CCCCCC;
            border-radius: 8px;
            font-size: 1rem;
            color: #111111;
            background-color: #FFFFFF;
            outline: none;
            transition: border-color 0.2s;
            font-weight: 600;
        }

        .input-wrapper input.no-left-icon {
            padding-left: 16px;
        }

        .input-wrapper input::placeholder {
            color: #999999;
            font-weight: 500;
        }

        .input-wrapper input:focus {
            border-color: #4A69BD;
        }

        /* Password rules list */
        .rules-list {
            margin-top: 6px;
            margin-bottom: 16px;
            padding-left: 4px;
        }

        .rule-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #777777;
            margin-bottom: 4px;
        }

        .rule-item.satisfied {
            color: #2ECC71;
            font-weight: 600;
        }

        .rule-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #CCCCCC;
        }

        .rule-item.satisfied .rule-dot {
            background-color: #2ECC71;
        }

        /* Save Button */
        .btn-save {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: #4A69BD;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 24px;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        /* Back to Login Link */
        .back-to-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            color: #4A69BD;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .back-to-login svg {
            width: 20px;
            height: 20px;
            fill: #4A69BD;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4c4.41 0 8 3.59 8 8s-3.59 8-8 8c-3.18 0-6.11-1.86-7.38-4.76l-1.87.7C4.31 19.38 7.89 21.5 12 21.5c5.25 0 9.5-4.25 9.5-9.5S17.25 2.5 12 2.5V0L7 4l5 4V4z"/>
                    <path d="M15 10h-1V8c0-2.21-1.79-4-4-4S6 5.79 6 8v2H5c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-6c0-1.1-.9-2-2-2zM8 8c0-1.1.9-2 2-2s2 .9 2 2v2H8V8z"/>
                </svg>
            </div>
            <h1>Forgot Password?</h1>
            <div class="subtitle">Enter your registered email address to set your new password</div>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <div class="input-wrapper">
                <svg class="left-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                <input type="email" id="forgot_email" placeholder="poornimad2247.sse@saveetha.com" value="poornimad2247.sse@saveetha.com">
            </div>
        </div>

        <div class="input-group">
            <label>Set New Password</label>
            <div class="input-wrapper">
                <input type="password" id="forgot_new_password" class="no-left-icon" placeholder="New Password">
                <svg id="toggle_forgot_new" class="right-icon" onclick="togglePasswordVisibility('forgot_new_password', this)" style="cursor: pointer; pointer-events: auto; z-index: 10;" data-toggle-password="true" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </div>
        </div>

        <!-- Real-Time Password Rules Indicator -->
        <div class="rules-list">
            <div id="rule_min" class="rule-item"><div class="rule-dot"></div><span>At least 6 characters</span></div>
            <div id="rule_upper" class="rule-item"><div class="rule-dot"></div><span>At least 1 uppercase letter</span></div>
            <div id="rule_spec" class="rule-item"><div class="rule-dot"></div><span>At least 1 special character</span></div>
        </div>

        <div class="input-group">
            <label>Confirm New Password</label>
            <div class="input-wrapper">
                <input type="password" id="forgot_confirm_password" class="no-left-icon" placeholder="Confirm new password">
                <svg id="toggle_forgot_confirm" class="right-icon" onclick="togglePasswordVisibility('forgot_confirm_password', this)" style="cursor: pointer; pointer-events: auto; z-index: 10;" data-toggle-password="true" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </div>
        </div>

        <button id="btn_save" class="btn-save">
            Save New Password
        </button>

        <a href="login_form.html" class="back-to-login">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Back to Login
        </a>
    </div>

    <script src="sync_manager.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            CholemetricSync.attachEyePasswordToggles();

            const inputNew = document.getElementById('forgot_new_password');
            const ruleMin = document.getElementById('rule_min');
            const ruleUpper = document.getElementById('rule_upper');
            const ruleSpec = document.getElementById('rule_spec');

            // Live password rules indicator watcher
            inputNew.addEventListener('input', function() {
                val = inputNew.value;
                const rules = CholemetricSync.validatePasswordRules(val);

                if (rules.hasMin) ruleMin.classList.add('satisfied'); else ruleMin.classList.remove('satisfied');
                if (rules.hasUpper) ruleUpper.classList.add('satisfied'); else ruleUpper.classList.remove('satisfied');
                if (rules.hasSpec) ruleSpec.classList.add('satisfied'); else ruleSpec.classList.remove('satisfied');
            });

            document.getElementById('btn_save').addEventListener('click', async (e) => {
                e.preventDefault();
                const email = document.getElementById('forgot_email').value.trim();
                const new_password = document.getElementById('forgot_new_password').value;
                const confirmPassword = document.getElementById('forgot_confirm_password').value;

                if (!email || !new_password) {
                    alert('Please fill all required fields.');
                    return;
                }

                // Check if email is registered
                if (!CholemetricSync.isEmailRegistered(email)) {
                    alert('Email is not registered');
                    return;
                }

                // Check password rules
                const rules = CholemetricSync.validatePasswordRules(new_password);
                if (!rules.isValid) {
                    alert('Password must be at least 6 characters long, contain at least 1 uppercase letter and 1 special character.');
                    return;
                }

                if (new_password !== confirmPassword) {
                    alert('Passwords do not match.');
                    return;
                }

                const btn = document.getElementById('btn_save');
                const originalText = btn.innerHTML;
                btn.innerHTML = 'Saving...';
                btn.style.pointerEvents = 'none';

                // Local update first for seamless offline & local server operation
                CholemetricSync.updateUserPassword(email, new_password);

                const isHttpsOrGithub = window.location.protocol === 'https:' || window.location.hostname.includes('github.io');
                if (isHttpsOrGithub) {
                    alert('Password reset successfully! Please sign in with your new password.');
                    window.location.href = 'login_form.html';
                    return;
                }

                try {
                    const response = await fetch(`${CholemetricSync.getApiBaseUrl()}/reset_password.php`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, new_password })
                    });
                } catch (err) {
                    console.warn('[Forgot Password] Backend API offline, updated password in local account store.');
                }

                alert('Password reset successfully! Please sign in with your new password.');
                window.location.href = 'login_form.html';
            });
        });
    </script>
</body>
</html>
